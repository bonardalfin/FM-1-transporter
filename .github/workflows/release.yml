name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - run: sudo apt-get update && sudo apt-get install -y cmake gcc-arm-none-eabi libnewlib-arm-none-eabi build-essential
      - run: git clone --depth 1 --branch 2.2.0 --recurse-submodules --shallow-submodules https://github.com/raspberrypi/pico-sdk $HOME/pico-sdk
      - name: Build
        run: |
          cmake -S . -B build-xiao -DPICO_SDK_PATH=$HOME/pico-sdk -DPICO_BOARD=seeed_xiao_rp2040
          cmake -S . -B build-probe -DPICO_SDK_PATH=$HOME/pico-sdk -DPICO_BOARD=pico -DFM1T_BOARD=debugprobe
          make -C build-xiao -j4 fm1_transporter
          make -C build-probe -j4 fm1_transporter
          mkdir dist
          cp build-xiao/fm1_transporter.uf2 dist/fm1_transporter_xiao_rp2040.uf2
          cp build-probe/fm1_transporter.uf2 dist/fm1_transporter_debugprobe.uf2
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*.uf2
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: uf2
          path: dist/*.uf2
