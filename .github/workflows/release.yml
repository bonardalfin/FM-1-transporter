name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - run: sudo apt-get update && sudo apt-get install -y cmake gcc-arm-none-eabi libnewlib-arm-none-eabi build-essential
      - run: git clone --depth 1 --branch 2.2.0 --recurse-submodules --shallow-submodules https://github.com/raspberrypi/pico-sdk $HOME/pico-sdk
      - name: Build
        run: |
          build() {  # name, cmake args...
            n=$1; shift
            cmake -S . -B build-$n -DPICO_SDK_PATH=$HOME/pico-sdk "$@"
            make -C build-$n -j4 fm1_transporter
            mkdir -p dist
            cp build-$n/fm1_transporter.uf2 dist/fm1_transporter_$n.uf2
          }
          build xiao_rp2040 -DPICO_BOARD=seeed_xiao_rp2040
          build pico -DPICO_BOARD=pico
          build pico2 -DPICO_BOARD=pico2
          build debugprobe -DPICO_BOARD=pico -DFM1T_BOARD=debugprobe
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*.uf2
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: uf2
          path: dist/*.uf2
